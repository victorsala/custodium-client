name = "custodium-b2c"
main = "src/index.js"
compatibility_date = "2026-06-01"

# Subdomini. Cloudflare crea el registre DNS automàticament al primer deploy.
routes = [
  { pattern = "b2c.custodium.space", custom_domain = true }
]

# Frontend estàtic. Es serveix des del mateix origen: zero CORS.
[assets]
directory = "./public"

# Variables per entorn (no secrets). ENV encén la franja d'avís del client a
# staging; SITE i MAIL_FROM fan que els correus de cada entorn apuntin a ell mateix.
# MAIL_CONTACT és l'adreça a què el correu d'avís de canvi de correu diu d'escriure.
[vars]
ENV = "production"
SITE = "https://b2c.custodium.space"
MAIL_FROM = "Custodium <avisos@custodium.space>"
MAIL_CONTACT = "avisos@custodium.space"

[[d1_databases]]
binding = "DB"
database_name = "custodium-b2c"
database_id = "425fbb2f-08d4-4d04-aa86-528acef0ad3d"

# Fitxers adjunts, xifrats al navegador. Crear amb:
#   npx wrangler r2 bucket create custodium-b2c-files --location weur
[[r2_buckets]]
binding = "FILES"
bucket_name = "custodium-b2c-files"

# Còpia setmanal dels fitxers. Només s'hi afegeix, mai s'hi esborra. Crear amb:
#   npx wrangler r2 bucket create custodium-b2c-files-backup --location weur
[[r2_buckets]]
binding = "FILES_BACKUP"
bucket_name = "custodium-b2c-files-backup"

# Disparadors: cada dia a les 08:00 UTC revisa inactivitat, avisa i entrega;
# cada diumenge a les 03:00 UTC copia els fitxers nous a FILES_BACKUP.
[triggers]
# Cloudflare no accepta "0" com a diumenge: cal "SUN".
crons = ["0 8 * * *", "0 3 * * SUN"]

# Secret (no va aquí): npx wrangler secret put RESEND_API_KEY

# ------------------------- staging -------------------------
# Mateix codi, dades i secrets separats. El desplega la CI a cada push a main
# (.github/workflows/ci.yml); README §5. Els secrets es posen amb
#   npx wrangler secret put RESEND_API_KEY --env staging   (i SMS_* si cal)
[env.staging]
name = "custodium-b2c-staging"
routes = [
  { pattern = "b2c-staging.custodium.space", custom_domain = true }
]

[env.staging.assets]
directory = "./public"

[env.staging.vars]
ENV = "staging"
SITE = "https://b2c-staging.custodium.space"
MAIL_FROM = "Custodium staging <avisos@custodium.space>"
MAIL_CONTACT = "avisos@custodium.space"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "custodium-b2c-staging"
database_id = "6b80cc70-e365-470a-a0f5-f3c9264704bf"

[[env.staging.r2_buckets]]
binding = "FILES"
bucket_name = "custodium-b2c-staging-files"

[[env.staging.r2_buckets]]
binding = "FILES_BACKUP"
bucket_name = "custodium-b2c-staging-files-backup"

[env.staging.triggers]
crons = ["0 8 * * *", "0 3 * * SUN"]
